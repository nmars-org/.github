name: "Org Security Policy Auditor"

on:
  schedule:
    # Runs daily at midnight
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual triggers

jobs:
  discover-repos:
    name: "Discover Public Repos"
    runs-on: ubuntu-latest
    outputs:
      repo_matrix: ${{ steps.fetch-repos.outputs.repos }}
    steps:
      - name: "Fetch Public and Non-Archived Repos"
        id: fetch-repos
        env:
          GH_TOKEN: ${{ secrets.ORG_MONITOR_TOKEN }}
          ORG_NAME: "nmars-org"
        run: |
          echo "Fetching repositories for organization: $ORG_NAME"
          
          # Queries the GitHub API with pagination. 
          # Filters out private (.private == false) and archived (.archived == false) repos.
          REPOS=$(gh api /orgs/$ORG_NAME/repos --paginate --jq '[.[] | select(.private == false and .archived == false) | {name: .name, full_name: .full_name, default_branch: .default_branch}]')
          
          # Compresses the JSON payload to fit within GitHub Actions output character limits
          COMPRESSED_REPOS=$(echo "$REPOS" | jq -c '.')
          
          echo "repos=${COMPRESSED_REPOS}" >> $GITHUB_OUTPUT

  audit-security-md:
    name: "Audit: ${{ matrix.repo.name }}"
    needs: discover-repos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Ensures other repo checks keep running if one repo fails
      matrix:
        repo: ${{ fromJson(needs.discover-repos.outputs.repo_matrix) }}
    steps:
      - name: "Check for SECURITY.md"
        env:
          GH_TOKEN: ${{ secrets.ORG_MONITOR_TOKEN }}
          REPO_FULL_NAME: ${{ matrix.repo.full_name }}
          DEFAULT_BRANCH: ${{ matrix.repo.default_branch }}
          REPO_NAME: ${{ matrix.repo.name }}
        run: |
          API_URL="https://api.github.com/repos/${REPO_FULL_NAME}/contents/SECURITY.md"

          STATUS_CODE=$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --get \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --data-urlencode "ref=${DEFAULT_BRANCH}" \
            "${API_URL}")

          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "✅ SECURITY.md is present in the default branch (${DEFAULT_BRANCH}) of ${REPO_NAME}."
          elif [ "$STATUS_CODE" -eq 404 ]; then
            echo "::error title=Missing Security Policy::SECURITY.md is missing in the default branch of public repository: ${REPO_NAME}"
            exit 1
          else
            echo "::error title=API Error::Received unexpected HTTP status ${STATUS_CODE} while checking ${REPO_NAME}."
            exit 1
          fi
