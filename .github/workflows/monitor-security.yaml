name: "Org SECURITY.md Auditor"

on:
  schedule:
    # Runs daily at midnight
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual triggers

permissions:
  contents: read

env:
  ORG_NAME: "konflux-ci"
  EXEMPTIONS_FILE: ".github/security-md-exemptions.yaml"
  # The single source of truth for the org security policy. Every other repo's
  # SECURITY.md is expected to be a short stub pointing here.
  POLICY_URL: "https://github.com/konflux-ci/.github/blob/HEAD/SECURITY.md"
  EXEMPTIONS_URL: "https://github.com/konflux-ci/.github/blob/HEAD/${EXEMPTIONS_FILE}"

jobs:
  audit:
    name: "Audit SECURITY.md"
    runs-on: ubuntu-latest
    outputs:
      results: ${{ steps.audit.outputs.results }}
      exempt: ${{ steps.audit.outputs.exempt }}
      in_scope: ${{ steps.audit.outputs.in_scope }}
      compliant: ${{ steps.audit.outputs.compliant }}
      missing: ${{ steps.audit.outputs.missing }}
    steps:
      - name: "Check Out Exemption List"
        uses: actions/checkout@v5

      - name: "Audit Org Repositories"
        id: audit
        env:
          GH_TOKEN: ${{ secrets.ORG_MONITOR_TOKEN }}
        run: |
          set -euo pipefail

          # A single GraphQL query returns each repo *and* whether SECURITY.md
          # exists on its default branch, 100 repos per page. This replaces one
          # REST list call plus one contents call per repo.
          read -r -d '' QUERY <<'GRAPHQL' || true
          query($org: String!, $endCursor: String) {
            organization(login: $org) {
              repositories(
                first: 100
                after: $endCursor
                privacy: PUBLIC
                isArchived: false
                orderBy: {field: NAME, direction: ASC}
              ) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  name
                  url
                  defaultBranchRef { name }
                  securityMd: object(expression: "HEAD:SECURITY.md") { __typename }
                }
              }
            }
          }
          GRAPHQL

          ALL=$(
            gh api graphql --paginate -f query="$QUERY" -F org="$ORG_NAME" |
              jq -sc '[.[].data.organization.repositories.nodes[]]'
          )
          echo "Discovered $(jq 'length' <<<"$ALL") public, non-archived repos."

          # Always produce a JSON array, including when the key is absent.
          EXEMPT=$(yq -o=json -I=0 '(.exemptions // []) | map(.repo)' "$EXEMPTIONS_FILE")
          EXEMPT_DETAIL=$(yq -o=json -I=0 '(.exemptions // [])' "$EXEMPTIONS_FILE")

          # Warn about exemptions that no longer match a repo in scope, so the
          # list does not silently rot as repos are renamed, archived, or deleted.
          jq -rn \
            --argjson ex "$EXEMPT" \
            --argjson found "$(jq -c '[.[].name]' <<<"$ALL")" \
            '$ex - $found | .[]' |
            while read -r STALE_REPO; do
              echo "::warning title=Stale Exemption::'${STALE_REPO}' is exempted in ${EXEMPTIONS_FILE} but is not a public, non-archived repo in ${ORG_NAME}. Consider removing the entry."
            done

          RESULTS=$(
            jq -c --argjson ex "$EXEMPT" '
              [ .[]
                | select(.name | IN($ex[]) | not)
                | {
                    name: .name,
                    url: .url,
                    branch: (.defaultBranchRef.name // "HEAD"),
                    # A repo with no commits has no default branch ref, so it
                    # cannot hold a SECURITY.md. Flagged separately in the report.
                    empty: (.defaultBranchRef == null),
                    compliant: (.securityMd != null)
                  }
              ] | sort_by(.compliant, .name)
            ' <<<"$ALL"
          )

          {
            printf 'results=%s\n'   "$RESULTS"
            printf 'exempt=%s\n'    "$EXEMPT_DETAIL"
            printf 'in_scope=%s\n'  "$(jq 'length' <<<"$RESULTS")"
            printf 'compliant=%s\n' "$(jq '[.[] | select(.compliant)] | length' <<<"$RESULTS")"
            printf 'missing=%s\n'   "$(jq '[.[] | select(.compliant | not)] | length' <<<"$RESULTS")"
          } >> "$GITHUB_OUTPUT"

  report:
    name: "Report Results"
    needs: audit
    # Renders the summary even if the audit step itself failed, so a partial or
    # failed run still explains itself on the run page.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Handle Failed Audit"
        if: needs.audit.result != 'success'
        run: |
          {
            echo "## 🔐 Org Security Policy Audit"
            echo
            echo "> [!CAUTION]"
            echo "> The audit job did not complete (\`${{ needs.audit.result }}\`). No results to report."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: "Render Summary"
        if: needs.audit.result == 'success'
        env:
          RESULTS: ${{ needs.audit.outputs.results }}
          EXEMPT: ${{ needs.audit.outputs.exempt }}
          IN_SCOPE: ${{ needs.audit.outputs.in_scope }}
          COMPLIANT: ${{ needs.audit.outputs.compliant }}
          MISSING: ${{ needs.audit.outputs.missing }}
        run: |
          set -euo pipefail

          PCT=0
          if [ "$IN_SCOPE" -gt 0 ]; then
            PCT=$(( COMPLIANT * 100 / IN_SCOPE ))
          fi
          # Build a 20-cell bar. Guard both ends: `printf 'X%.0s'` with an empty
          # argument list still emits the literal once, which would add a stray
          # cell at exactly 0% and 100%.
          FILLED=$(( PCT / 5 ))
          BAR=""
          if [ "$FILLED" -gt 0 ]; then
            BAR=$(printf '█%.0s' $(seq 1 "$FILLED"))
          fi
          if [ "$FILLED" -lt 20 ]; then
            BAR="${BAR}$(printf '░%.0s' $(seq 1 $(( 20 - FILLED ))))"
          fi

          if [ "$MISSING" -eq 0 ]; then
            BADGE="> [!TIP]
          > **All ${IN_SCOPE} in-scope repositories have a \`SECURITY.md\`.** 🎉"
          else
            BADGE="> [!WARNING]
          > **${MISSING} of ${IN_SCOPE} in-scope repositories are missing \`SECURITY.md\`.**"
          fi

          {
            echo "## 🔐 Org Security Policy Audit"
            echo
            echo "[\`${ORG_NAME}\`](https://github.com/${ORG_NAME}) · audited $(date -u '+%Y-%m-%d %H:%M UTC') · [canonical policy](${POLICY_URL})"
            echo
            echo "$BADGE"
            echo
            echo "| Metric | Count |"
            echo "| :--- | ---: |"
            echo "| ✅ Compliant | **${COMPLIANT}** |"
            echo "| ❌ Missing \`SECURITY.md\` | **${MISSING}** |"
            echo "| 🛡️ Exempt | $(jq 'length' <<<"$EXEMPT") |"
            echo "| **In scope** | **${IN_SCOPE}** |"
            echo
            echo "**Coverage ${PCT}%** \`${BAR}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Non-compliant repos, listed with a link to the repository itself.
          # Reporting only -- remediation is left to a human.
          if [ "$MISSING" -gt 0 ]; then
            {
              echo "### ❌ Missing \`SECURITY.md\` (${MISSING})"
              echo
              echo "| Repository | Default branch |"
              echo "| :--- | :--- |"
              jq -r '
                .[] | select(.compliant | not)
                | if .empty then
                    "| [\(.name)](\(.url)) | _none — empty repo, no commits_ |"
                  else
                    "| [\(.name)](\(.url)) | `\(.branch)` |"
                  end
              ' <<<"$RESULTS"
              echo
              echo "> [!NOTE]"
              echo "> Each repo above needs a \`SECURITY.md\` on its default branch"
              echo "> pointing at the [canonical policy](${POLICY_URL}). If the check does"
              echo "> not apply to a repo, add it to the [exemptions file](${EXEMPTIONS_URL}) with a reason."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "<details>"
            echo "<summary>✅ Compliant (${COMPLIANT})</summary>"
            echo
            jq -r '.[] | select(.compliant) | "- [\(.name)](\(.url)/blob/\(.branch)/SECURITY.md)"' <<<"$RESULTS"
            echo
            echo "</details>"
            echo
            echo "<details>"
            echo "<summary>🛡️ Exempt ($(jq 'length' <<<"$EXEMPT"))</summary>"
            echo
            echo "| Repository | Reason |"
            echo "| :--- | :--- |"
            jq -r '.[] | "| `\(.repo)` | \(.reason // "_no reason given_") |"' <<<"$EXEMPT"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # Mirror the per-repo findings into the run's annotation stream. This
          # step deliberately does not fail: rendering the report succeeded, and
          # whether the org is compliant is decided by the compliance-gate job.
          if [ "$MISSING" -gt 0 ]; then
            jq -r '.[] | select(.compliant | not) | "::warning title=Missing Security Policy::\(.name) has no SECURITY.md on its default branch."' <<<"$RESULTS"
          fi

  # Separates the two ways this workflow can go red.
  #
  #   audit / report red  -> the workflow itself is broken (bad token, API
  #                          failure, malformed exemption file, shell error).
  #   compliance-gate red -> the workflow ran clean; repos are non-conforming.
  #
  # GitHub Actions has no amber "warning" conclusion for a run, job, or step --
  # `continue-on-error` renders green, and the runner cannot emit the `neutral`
  # conclusion the Checks API supports. Splitting the gate into its own job is
  # what makes the failure mode legible at a glance in the job list instead.
  #
  # No `if:` here on purpose: the default `success()` means this job is *skipped*
  # rather than run whenever audit or report failed, so a broken workflow never
  # also trips the compliance gate.
  compliance-gate:
    name: "Compliance Gate"
    needs: [audit, report]
    runs-on: ubuntu-latest
    steps:
      - name: "Fail If Non-Compliant"
        env:
          IN_SCOPE: ${{ needs.audit.outputs.in_scope }}
          MISSING: ${{ needs.audit.outputs.missing }}
        run: |
          set -euo pipefail

          if [ "$MISSING" -gt 0 ]; then
            echo "::error title=Non-Compliant Repositories::${MISSING} of ${IN_SCOPE} in-scope repositories are missing SECURITY.md. The audit itself ran clean -- see the run summary for the list."
            exit 1
          fi

          echo "::notice title=Compliant::All ${IN_SCOPE} in-scope repositories have a SECURITY.md."
