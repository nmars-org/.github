# Repositories exempt from the SECURITY.md check in
# .github/workflows/monitor-security.yaml
#
# Entries are matched against the repository name (not the full name), since
# the auditor only ever scans a single organization.
#
# Every exemption needs a reason. Prefer a tracking issue over an open-ended
# justification -- an exemption with a ticket behind it is one someone will
# eventually remove.

exemptions:
  - repo: .github
    reason: "Configuration repo for the organization"
  - repo: brand-assets
    reason: "No code"
  - repo: discussions
    reason: "Inactive, no code"
  - repo: .fullsend
    reason: "Not used after per-repo migration"
  - repo: konflux-casc
    reason: "Unused"
  - repo: llm-compressor-container
    reason: "Unused"
  - repo: multi-arch-konflux-example
    reason: "Demo repo"
  - repo: multi-arch
    reason: "Unused"
  - repo: multi-version-konflux-stage-sample
    reason: "Demo repo"
  - repo: namespace-generator
    reason: "Unused"
  - repo: osv-offline
    reason: "Content copy of redhat-exd-rebuilds/osv-offline, a fork of upstream renovatebot/osv-offline"
  - repo: planning
    reason: "Unused"
  - repo: prioritize
    reason: "Used for Jira"
  - repo: pr-review-webhook
    reason: "Demo repo"
  - repo: release-service-docs
    reason: "Documentation repo"
  - repo: rpmbuild-pipeline-monorepo-mock-config-test
    reason: "Unused"
  - repo: rpmbuild-pipeline-test-sources
    reason: "Unused"
  - repo: sample-component-golang
    reason: "Demo repo for onboarding"
  - repo: support
    reason: "Used for issue tracking, no code"
  - repo: testrepo
    reason: "Demo repo for testing"
  - repo: tests-common-packages
    reason: "Empty repo"
