# Repositories exempt from the SECURITY.md check in
# .github/workflows/monitor-security.yaml
#
# Entries are matched against the repository name (not the full name), since
# the auditor only ever scans a single organization.
#
# Every exemption needs a reason. Prefer a tracking issue over an open-ended
# justification -- an exemption with a ticket behind it is one someone will
# eventually remove.

exemptions:
  - repo: test
    reason: "Demo repo"
  - repo: repo1
    reason: "Demo repo"
  - repo: repo4
    reason: "Demo repo"
